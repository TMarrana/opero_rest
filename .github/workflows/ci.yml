name: CI

# Um PR corre o CI uma vez (pull_request); o push so corre na main, depois do merge.
on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.dev

jobs:
  sqlite:
    name: Testes em SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: ruff check .
      - run: pytest -q

  postgres:
    name: Migracoes e testes em PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/opero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Aplica as migracoes reais a uma base vazia: o --no-migrations do pytest.ini esconde-as.
      - run: python manage.py migrate
      - run: pytest -q --migrations

  css:
    name: Build do CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Descarregar o Tailwind standalone
        run: |
          mkdir -p tools static/css
          curl -fsSL -o tools/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tools/tailwindcss
      - run: python manage.py css --minify
