{% load static %}<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171C">
  <title>{% block title %}Opero{% endblock %} · Opero</title>
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/alpine.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
{# Shell escuro, coluna única, ação na zona do polegar (secção 5). #}
<body class="min-h-screen bg-carvao text-aco"
      data-trabalhador="{{ request.user.worker.pk|default:'' }}"
      data-pin-url="{% url 'staff:pin_login' %}"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <main class="mx-auto flex min-h-screen w-full max-w-md flex-col px-5 pb-8 pt-6">
    {% block content %}{% endblock %}
  </main>
  {% include "components/toast.html" %}
  {% block scripts %}{% endblock %}
</body>
</html>
