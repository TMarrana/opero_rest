{# Separadores das compras (Fase 11), em pílula. #}
<nav class="separadores mt-5" aria-label="Compras">
  {% url 'purchasing:lista' as url_lista %}
  {% url 'purchasing:encomendas' as url_encomendas %}
  {% url 'purchasing:rececoes' as url_rececoes %}
  {% url 'purchasing:fornecedores' as url_fornecedores %}
  <a href="{{ url_lista }}" class="separador {% if request.path == url_lista %}separador-ativo{% endif %}"{% if request.path == url_lista %} aria-current="page"{% endif %}>Lista de compras</a>
  <a href="{{ url_encomendas }}" class="separador {% if '/encomendas/' in request.path %}separador-ativo{% endif %}"{% if '/encomendas/' in request.path %} aria-current="page"{% endif %}>Encomendas</a>
  <a href="{{ url_rececoes }}" class="separador {% if '/rececoes/' in request.path %}separador-ativo{% endif %}"{% if '/rececoes/' in request.path %} aria-current="page"{% endif %}>Receções</a>
  <a href="{{ url_fornecedores }}" class="separador {% if '/fornecedores/' in request.path %}separador-ativo{% endif %}"{% if '/fornecedores/' in request.path %} aria-current="page"{% endif %}>Fornecedores</a>
</nav>
