{# Separadores das fichas técnicas (Fase 13), em pílula. #}
<nav class="separadores mt-5" aria-label="Fichas técnicas">
  {% url 'recipes:lista' as url_lista %}
  {% url 'recipes:pos' as url_pos %}
  <a href="{{ url_lista }}" class="separador {% if request.path != url_pos %}separador-ativo{% endif %}"{% if request.path != url_pos %} aria-current="page"{% endif %}>Fichas</a>
  <a href="{{ url_pos }}" class="separador {% if request.path == url_pos %}separador-ativo{% endif %}"{% if request.path == url_pos %} aria-current="page"{% endif %}>Produtos do POS sem ficha</a>
</nav>
