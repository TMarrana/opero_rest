{# Separadores da área do grupo (Fase 9), em pílula. #}
<nav class="separadores mt-5" aria-label="Grupo">
  {% url 'grupo:painel' as url_painel %}
  {% url 'grupo:casas' as url_casas %}
  <a href="{{ url_painel }}" class="separador {% if request.path == url_painel %}separador-ativo{% endif %}"{% if request.path == url_painel %} aria-current="page"{% endif %}>Painel</a>
  <a href="{{ url_casas }}" class="separador {% if request.path != url_painel %}separador-ativo{% endif %}"{% if request.path != url_painel %} aria-current="page"{% endif %}>Casas e acessos</a>
</nav>
