{% comment %}
Badge de estado. Parâmetros:
  label    — texto (obrigatório)
  variante — chama (alerta: stock baixo) | servico (em serviço/aprovado) | neutro (default)
{% endcomment %}
{% if variante == "chama" %}
<span class="inline-flex items-center rounded-full bg-chama px-2.5 py-0.5 text-xs font-semibold text-superficie">{{ label }}</span>
{% elif variante == "servico" %}
<span class="inline-flex items-center rounded-full bg-servico px-2.5 py-0.5 text-xs font-semibold text-carvao">{{ label }}</span>
{% else %}
<span class="inline-flex items-center rounded-full bg-ardosia/15 px-2.5 py-0.5 text-xs font-semibold text-ardosia">{{ label }}</span>
{% endif %}
