{% extends "base_staff.html" %}
{% block title %}Ponto{% endblock %}
{% block content %}
<header>
  <p class="text-lg">Olá, <span class="font-semibold">{{ worker.full_name }}</span></p>
  <p class="font-dados text-sm text-ardosia">{% now "H:i · l" %}</p>
</header>

<div class="mt-10 flex flex-1 flex-col">
  {% include "partials/staff/ponto.html" %}

  <nav class="mt-auto flex justify-center gap-8 pt-10 text-sm font-medium">
    <a href="{% url 'staff:historico' %}" class="text-aco/70 underline underline-offset-4 hover:text-superficie">Histórico</a>
    <a href="{% url 'staff:ferias' %}" class="text-aco/70 underline underline-offset-4 hover:text-superficie">Férias</a>
  </nav>
</div>

<form method="post" action="{% url 'accounts:logout' %}" class="mt-6 text-center">
  {% csrf_token %}
  <input type="hidden" name="next" value="{% url 'staff:pin_login' %}">
  <button type="submit" class="min-h-toque text-xs text-ardosia underline underline-offset-2">Sair</button>
</form>
{% endblock %}
