{% load interface %}{# Cabeçalho das páginas da app: voltar e título. Parâmetros: titulo, voltar (url). #}
<header class="flex items-center gap-3">
  <a href="{{ voltar }}" class="btn-icone bg-superficie" aria-label="Voltar">{% icone "seta-esquerda" %}</a>
  <h1 class="font-display text-2xl font-bold leading-tight">{{ titulo }}</h1>
  {% if request.user.is_backoffice %}
  <a href="{% url 'dashboard:home' %}" class="ml-auto inline-flex min-h-toque items-center rounded-full px-4 text-sm font-semibold text-floresta transition-colors hover:bg-neutro-100">Gestão</a>
  {% endif %}
</header>
