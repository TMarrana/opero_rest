line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", "re-factorial", "floorplan"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "DJ"]
ignore = [
    # `l` para "linha" em compreensoes e ciclos (118 ocorrencias); estilo, nao bug.
    "E741",
    # zip() sem strict=: strict=True mudaria o comportamento se os tamanhos diferissem (6 ocorrencias).
    "B905",
]
